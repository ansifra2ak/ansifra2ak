name: Update profile art

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "image.png"
      - "scripts/**"

permissions:
  contents: write

jobs:
  generate-profile-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Prepare portrait
        run: |
          python scripts/prep_photo.py

      - name: Generate ASCII portrait
        run: |
          python scripts/make_ascii_svg.py

      - name: Commit generated portrait
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate ASCII profile portrait"
          file_pattern: "source-prepped.png ansif-ascii.svg"
