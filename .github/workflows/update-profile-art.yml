name: Update profile art

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "image.png"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  generate-profile-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Prepare portrait
        run: |
          python scripts/prep_photo.py

      - name: Generate ASCII portrait
        run: |
          python scripts/make_ascii_svg.py

      - name: Generate contribution heatmap
        run: |
          python scripts/make_contrib_heatmap.py

      - name: Commit generated profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source-prepped.png ansif-ascii.svg contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh profile art"

          git pull --rebase origin main
          git push origin main
