import os
import json
import urllib.request
from datetime import datetime, timezone, timedelta
from xml.sax.saxutils import escape


USERNAME = os.getenv("GITHUB_USERNAME", "ansifra2ak")
TOKEN = os.getenv("GITHUB_TOKEN") or os.getenv("GH_TOKEN")
OUTPUT = "contrib-heatmap.svg"

WIDTH = 860
HEIGHT = 210

BG = "#0d1117"
TEXT = "#8b949e"
TEXT_BRIGHT = "#c9d1d9"
EMPTY = "#161b22"

LEVELS = {
    0: EMPTY,
    1: "#0e4429",
    2: "#006d32",
    3: "#26a641",
    4: "#39d353",
}


def fetch_contributions():
    if not TOKEN:
        raise RuntimeError(
            "GITHUB_TOKEN is missing. "
            "The workflow must pass GITHUB_TOKEN to this script."
        )

    now = datetime.now(timezone.utc)
    start = now - timedelta(days=370)

    query = """
    query($login: String!, $from: DateTime!, $to: DateTime!) {
      user(login: $login) {
        contributionsCollection(from: $from, to: $to) {
          contributionCalendar {
            totalContributions
            weeks {
              firstDay
              contributionDays {
                date
                contributionCount
                contributionLevel
                weekday
              }
            }
          }
        }
      }
    }
    """

    payload = {
        "query": query,
        "variables": {
            "login": USERNAME,
            "from": start.isoformat(),
            "to": now.isoformat(),
        },
    }

    request = urllib.request.Request(
        "https://api.github.com/graphql",
        data=json.dumps(payload).encode("utf-8"),
        headers={
            "Authorization": f"Bearer {TOKEN}",
            "Content-Type": "application/json",
            "User-Agent": "github-profile-heatmap",
        },
        method="POST",
    )

    with urllib.request.urlopen(request, timeout=30) as response:
        data = json.loads(response.read().decode("utf-8"))

    if "errors" in data:
        raise RuntimeError(
            "GitHub GraphQL error: "
            + json.dumps(data["errors"], indent=2)
        )

    user = data.get("data", {}).get("user")

    if not user:
        raise RuntimeError(f"GitHub user '{USERNAME}' was not found.")

    return user["contributionsCollection"]["contributionCalendar"]


def color_for_level(level_name):
    mapping = {
        "NONE": LEVELS[0],
        "FIRST_QUARTILE": LEVELS[1],
        "SECOND_QUARTILE": LEVELS[2],
        "THIRD_QUARTILE": LEVELS[3],
        "FOURTH_QUARTILE": LEVELS[4],
    }
    return mapping.get(level_name, LEVELS[0])


def month_labels(weeks):
    labels = []
    previous_month = None

    for week_index, week in enumerate(weeks):
        first_day = datetime.strptime(
            week["firstDay"], "%Y-%m-%d"
        )

        month = first_day.month

        if month != previous_month:
            labels.append(
                (
                    week_index,
                    first_day.strftime("%b"),
                )
            )
            previous_month = month

    return labels


def generate_svg(calendar):
    weeks = calendar["weeks"]

    # GitHub can occasionally return 54 partial weeks.
    if len(weeks) > 53:
        weeks = weeks[-53:]

    total = sum(
        day["contributionCount"]
        for week in weeks
        for day in week["contributionDays"]
    )

    cell = 11
    gap = 3
    step = cell + gap

    grid_x = 72
    grid_y = 55

    graph_width = len(weeks) * step

    svg = []

    svg.append(
        f'''<svg xmlns="http://www.w3.org/2000/svg"
width="{WIDTH}"
height="{HEIGHT}"
viewBox="0 0 {WIDTH} {HEIGHT}"
role="img"
aria-labelledby="title desc">'''
    )

    svg.append(
        f"<title id=\"title\">{escape(USERNAME)} GitHub contribution graph</title>"
    )

    svg.append(
        f"<desc id=\"desc\">{total} contributions in the last year</desc>"
    )

    svg.append(
        f'<rect width="{WIDTH}" height="{HEIGHT}" rx="8" fill="{BG}"/>'
    )

    svg.append(
        """
<style>
text {
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
}

.cell {
    transform-box: fill-box;
    transform-origin: center;
    animation: reveal 700ms cubic-bezier(.2,.8,.2,1) both;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(.25);
    }
    60% {
        opacity: 1;
        transform: scale(1.12);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.cursor {
    animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
</style>
"""
    )

    # Terminal-style command line
    svg.append(
        f'''
<text
    x="{WIDTH / 2}"
    y="24"
    text-anchor="middle"
    fill="{TEXT_BRIGHT}"
    font-size="15"
    font-weight="700">
    {escape(USERNAME)}@github ~ $ ./contributions.sh
</text>
'''
    )

    # Month labels
    for week_index, month in month_labels(weeks):
        x = grid_x + week_index * step

        svg.append(
            f'''
<text
    x="{x}"
    y="{grid_y - 13}"
    fill="{TEXT}"
    font-size="10">
    {month}
</text>
'''
        )

    # Day labels
    day_labels = {
        1: "Mon",
        3: "Wed",
        5: "Fri",
    }

    for weekday, label in day_labels.items():
        y = grid_y + weekday * step + 9

        svg.append(
            f'''
<text
    x="{grid_x - 10}"
    y="{y}"
    text-anchor="end"
    fill="{TEXT}"
    font-size="10">
    {label}
</text>
'''
        )

    # Contribution cells
    animation_index = 0

    for week_index, week in enumerate(weeks):
        for day in week["contributionDays"]:
            weekday = int(day["weekday"])

            x = grid_x + week_index * step
            y = grid_y + weekday * step

            count = int(day["contributionCount"])
            color = color_for_level(
                day["contributionLevel"]
            )

            delay = animation_index * 0.006
            animation_index += 1

            date = escape(day["date"])

            svg.append(
                f'''
<rect
    class="cell"
    x="{x}"
    y="{y}"
    width="{cell}"
    height="{cell}"
    rx="2"
    fill="{color}"
    style="animation-delay:{delay:.3f}s">
    <title>{date}: {count} contribution{"s" if count != 1 else ""}</title>
</rect>
'''
            )

    # Contribution total
    total_y = grid_y + (7 * step) + 21

    svg.append(
        f'''
<text
    x="{grid_x}"
    y="{total_y}"
    fill="{TEXT_BRIGHT}"
    font-size="12"
    font-weight="700">
    {total} contributions in the last year
</text>
'''
    )

    # Legend
    legend_x = min(
        WIDTH - 175,
        grid_x + graph_width - 130,
    )

    legend_y = total_y - 10

    svg.append(
        f'''
<text
    x="{legend_x - 34}"
    y="{legend_y + 10}"
    fill="{TEXT}"
    font-size="9">
    Less
</text>
'''
    )

    for index, color in enumerate(
        [
            LEVELS[0],
            LEVELS[1],
            LEVELS[2],
            LEVELS[3],
            LEVELS[4],
        ]
    ):
        x = legend_x + index * 15

        svg.append(
            f'''
<rect
    x="{x}"
    y="{legend_y}"
    width="10"
    height="10"
    rx="2"
    fill="{color}"/>
'''
        )

    svg.append(
        f'''
<text
    x="{legend_x + 80}"
    y="{legend_y + 10}"
    fill="{TEXT}"
    font-size="9">
    More
</text>
'''
    )

    svg.append("</svg>")

    return "\n".join(svg)


def main():
    print(f"Fetching GitHub contributions for {USERNAME}...")

    calendar = fetch_contributions()

    svg = generate_svg(calendar)

    with open(OUTPUT, "w", encoding="utf-8") as file:
        file.write(svg)

    total = sum(
        day["contributionCount"]
        for week in calendar["weeks"]
        for day in week["contributionDays"]
    )

    print(f"Generated {OUTPUT}")
    print(f"GitHub contributions found: {total}")


if __name__ == "__main__":
    main()
